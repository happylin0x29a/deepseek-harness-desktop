<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DeepSeek Harness</title>
    <link rel="stylesheet" href="splash.css" />
  </head>
  <body>
    <main>
      <img id="logo" src="logo.png" alt="" />
      <h1>DeepSeek Harness</h1>
      <p id="status">正在启动…</p>
      <div id="spinner" aria-hidden="true"></div>
      <div id="progress" hidden>
        <div class="progress-track"><div id="progress-fill"></div></div>
        <span id="progress-pct"></span>
      </div>
      <!-- Shown only while the shell is actually preparing the built-in
           runtime; splash.js reveals it from the startup phase. -->
      <p id="hint" hidden>首次启动如未检测到 dsh，将自动从国内镜像下载运行时（约 350 MB），请耐心等待。</p>
      <pre id="detail" hidden></pre>
    </main>
    <script src="splash.js"></script>
  </body>
</html>
